[package]
name = "boba-cat"
version = "2.2.0"
description = "Simple cat enjoying some boba"
authors = ["lyova24"]
edition = "2021"
license = "MIT"

[lib]
name = "boba_cat_lib"
path = "backend/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "boba-cat"
path = "backend/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
active-win-pos-rs = "0.11.0"
regex = "1.13.1"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
xcb = "1.7.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
