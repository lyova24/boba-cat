name: build desktop bundles

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
            args: ""
          - platform: ubuntu-22.04-arm
            name: linux-arm64
            args: ""
          - platform: windows-latest
            name: windows-x64
            args: ""
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxcb-ewmh-dev libxcb-randr0-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src -> target

      - run: npm ci

      - run: npm run build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v6
        with:
          name: boba-cat-${{ matrix.name }}
          path: src/target/**/release/bundle/**/*
          if-no-files-found: error
